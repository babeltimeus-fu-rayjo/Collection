<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Avenir Next', Avenir, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #17362a, #0c221a);
      color: #eef4f0;
    }
    main { text-align: center; padding: 24px; }
    h1 { font-weight: 900; letter-spacing: 0.06em; }
    a.game {
      display: inline-block;
      margin-top: 12px;
      padding: 18px 30px;
      border-radius: 16px;
      background: linear-gradient(180deg, #ffd76e, #f0a020);
      color: #3a2500;
      font-size: 22px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
    }
    a.game:hover { filter: brightness(1.05); }
    p { color: #9fb4aa; max-width: 34em; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Collection</h1>
    <p>Small web games, served straight from GitHub Pages.</p>
    <a class="game" href="./dnup/">▼▲ Play DNUP</a>
    <p>A peer-to-peer card game for 2–5 players — no accounts, no server.</p>
  </main>
</body>
</html>
